# Point cloud merge config only.
# This file is shared by hardware and simulation.

pointcloud_merge_node:
  ros__parameters:
    target_frame: 4w4l/base_link
    publish_static_tf: true
    publish_rate_hz: 20.0
    max_cloud_age_sec: 0.0

    camera_names:
      - front
      - rear

    cameras:
      front:
        enabled: true
        depth_topic: /robot_4w4l/front_camera/depth/image_rect_raw
        camera_info_topic: /robot_4w4l/front_camera/depth/camera_info
        mount_frame: 4w4l/F_camera_link
        optical_frame: 4w4l/F_camera_link
      rear:
        enabled: true
        depth_topic: /robot_4w4l/rear_camera/depth/image_rect_raw
        camera_info_topic: /robot_4w4l/rear_camera/depth/camera_info
        mount_frame: 4w4l/R_camera_link
        optical_frame: 4w4l/R_camera_link

    depth_filter:
      min_range: 0.05
      max_range: 2.5
      pixel_stride: 2
