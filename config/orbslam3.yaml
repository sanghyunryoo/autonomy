profiles:
  simulation:
    # Select "stereo" to run ORB-SLAM3 without IMU, or "stereo_inertial" to use stereo-IMU.
    sensor_type: stereo
    settings:
      File.version: "1.0"
      Camera.type: PinHole

      Camera1.fx: 554.3306990289407
      Camera1.fy: 554.3306990289407
      Camera1.cx: 320.0
      Camera1.cy: 240.0
      Camera1.k1: 0.0
      Camera1.k2: 0.0
      Camera1.p1: 0.0
