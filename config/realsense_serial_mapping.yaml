# Camera identity, topic, and point cloud merge map.
# Auto-generated from URDF camera links.
# Fill serial_no and model before running the hardware serial mapper.

camera_bindings:
  - role: front
    enabled: true
    serial_no: ""
    model: d435
    camera_name: front_camera
    depth_topic: /robot_4w4l/front_camera/depth/image_rect_raw
    camera_info_topic: /robot_4w4l/front_camera/depth/camera_info
    publish_frame: F_camera_link
    mount_frame: F_camera_link
    optical_frame: F_camera_link

  - role: rear
    enabled: true
    serial_no: ""
    model: d435
    camera_name: rear_camera
    depth_topic: /robot_4w4l/rear_camera/depth/image_rect_raw
    camera_info_topic: /robot_4w4l/rear_camera/depth/camera_info
    publish_frame: R_camera_link
    mount_frame: R_camera_link
    optical_frame: R_camera_link

stream:
  depth_width: 640
  depth_height: 480
  depth_fps: 60
  max_range: 2.5
  fallback_profiles:
    - {depth_width: 640, depth_height: 480, depth_fps: 30}
    - {depth_width: 848, depth_height: 480, depth_fps: 60}
    - {depth_width: 640, depth_height: 360, depth_fps: 60}
    - {depth_width: 424, depth_height: 240, depth_fps: 60}

pointcloud_merge_node:
  ros__parameters:
    target_frame: 4w4l/base_link
    publish_static_tf: true
    publish_rate_hz: 20.0
    max_cloud_age_sec: 0.0

    depth_filter:
      min_range: 0.05
      max_range: 2.5
      pixel_stride: 2
