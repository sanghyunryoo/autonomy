operation_modes:
  drive:
    camera_roles: [front, rear]
    require_roles: []

  adas:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  fsd:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  tracking:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  mapping:
    camera_roles: []
    require_roles: []

camera_bindings:
  simulation:
    - role: adas
      enabled: false
      model: d435i
      camera_name: adas_camera
      rgb_topic: /robot_4w4l/adas_camera/rgb/image_raw
      rgb_camera_info_topic: /robot_4w4l/adas_camera/rgb/camera_info
      left_image_topic: /robot_4w4l/adas_camera/left/image_raw
      right_image_topic: /robot_4w4l/adas_camera/right/image_raw
      left_camera_info_topic: /robot_4w4l/adas_camera/left/camera_info
      right_camera_info_topic: /robot_4w4l/adas_camera/right/camera_info
      imu_topic: /robot_4w4l/imu
      depth_topic: /robot_4w4l/adas_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/adas_camera/depth/camera_info
      mount_frame: A_camera_link
      optical_frame: A_camera_link

    - role: front
      enabled: true
      model: d435i
      camera_name: front_camera
      imu_topic: /robot_4w4l/front_camera/imu
      rgb_topic: /robot_4w4l/front_camera/rgb/image_raw
      rgb_camera_info_topic: /robot_4w4l/front_camera/rgb/camera_info
      depth_topic: /robot_4w4l/front_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/front_camera/depth/camera_info
      mount_frame: F_camera_link
      optical_frame: F_camera_link

    - role: rear
      enabled: false
      model: d435
      camera_name: rear_camera
      depth_topic: /robot_4w4l/rear_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/rear_camera/depth/camera_info
      mount_frame: R_camera_link
      optical_frame: R_camera_link

  real:
    - role: adas
      enabled: false
      usb_port_id: ""
      model: d435
      camera_name: adas_camera
      rgb_topic: /adas_camera/color/image_raw
      rgb_camera_info_topic: /adas_camera/color/camera_info
      left_image_topic: /adas_camera/infra1/image_rect_raw
      right_image_topic: /adas_camera/infra2/image_rect_raw
      left_camera_info_topic: /adas_camera/infra1/camera_info
      right_camera_info_topic: /adas_camera/infra2/camera_info
      imu_topic: /adas_camera/imu
      depth_topic: /adas_camera/depth/image_rect_raw
      camera_info_topic: /adas_camera/depth/camera_info
      mount_frame: A_camera_link
      optical_frame: A_camera_link

    - role: front
      enabled: true
      usb_port_id: "2-1.4"
      model: d435i
      camera_name: front_camera
      imu_topic: /front_camera/imu
      rgb_topic: /front_camera/color/image_raw
      rgb_camera_info_topic: /front_camera/color/camera_info
      depth_topic: /front_camera/depth/image_rect_raw
      camera_info_topic: /front_camera/depth/camera_info
      mount_frame: F_camera_link
      optical_frame: F_camera_link

    - role: rear
      enabled: false
      usb_port_id: "2-1.1"
      model: d435
      camera_name: rear_camera
      depth_topic: /rear_camera/depth/image_rect_raw
      camera_info_topic: /rear_camera/depth/camera_info
      mount_frame: R_camera_link
      optical_frame: R_camera_link

stream:
  depth_width: 640
  depth_height: 480
  depth_fps: 60
  color_width: 640
  color_height: 480
  color_fps: 30
  max_range: 2.5
  fallback_profiles:
    - {depth_width: 640, depth_height: 480, depth_fps: 30, color_width: 640, color_height: 480, color_fps: 30}
    - {depth_width: 848, depth_height: 480, depth_fps: 60, color_width: 848, color_height: 480, color_fps: 30}
    - {depth_width: 640, depth_height: 360, depth_fps: 60, color_width: 640, color_height: 360, color_fps: 30}
    - {depth_width: 424, depth_height: 240, depth_fps: 60, color_width: 424, color_height: 240, color_fps: 30}

camera_temperature:
  enabled: true
  publish_rate_hz: 1.0
  danger_celsius: 70.0
  shutdown_on_danger: true

dds_network:
  mode: wireless  # wired or wireless
  interface: enP8p1s0 # optional, e.g. eth0 or enp3s0. Empty selects a connected wired interface.
  local_ip: 192.168.20.10/24
  peer_ip: 192.168.20.1
  allow_multicast: true

livox_network:
  enabled: true
  mode: auto
  interface: ""          # Empty selects a connected wired interface.
  host_ip: 192.168.1.50/24
  gateway_ip: 192.168.1.1
  scan_cidr: 192.168.1.0/24
  lidar_ip: auto         # Set explicit IP to skip scan, e.g. 192.168.1.102.
  serial_suffix: ""      # Optional: last serial digits; tries 192.168.1.1XX first.
  config_output: /tmp/autonomy_livox_mid360_config.json
  install_nmap_if_missing: false

robot_state_publisher:
  ros__parameters:
    enabled: true
    urdf_path: src/autonomy/resources/urdf/f4.urdf
    frame_prefix: 4w4l/

lidar:
  ros__parameters:
    robot_base_frame: 4w4l/base_link
    robot_lidar_frame: 4w4l/lidar_link
    urdf_link_name: lidar_link
    driver_frame: livox_frame
    publish_driver_frame_alias: true
    pointcloud_topic: /livox/lidar
    imu_topic: /livox/imu
    pointcloud_topic_simulation: /robot_4w4l/livox/lidar
    imu_topic_simulation: /robot_4w4l/imu

pointcloud_merge_node:
  ros__parameters:
    target_frame: 4w4l/base_link
    frame_prefix: 4w4l/
    publish_rate_hz: 50.0
    max_cloud_age_sec: 0.0
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status

    depth_filter:
      min_range: 0.05
      max_range: 2.5
      pixel_stride: 2

imu_stabilized_tf_node:
  ros__parameters:
    imu_topic: /robot_4w4l/front_camera/imu
    base_frame_id: 4w4l/base_link
    stabilized_frame_id: 4w4l/base_stabilized
    publish_rate_hz: 100.0
    low_pass_alpha: 0.08
    min_accel_norm: 3.0
    max_accel_norm: 20.0
    roll_sign: -1.0
    pitch_sign: -1.0

elevation_mapping_node:
  ros__parameters:
    input_cloud_topic: /pointcloud_merge_node/merged_points
    output_image_topic: ~/elevation_image
    output_cloud_topic: ~/elevation_points
    output_masked_height_scan_topic: ~/masked_height_scan
    output_publish_rate_hz: 10.0
    command_filter_topic: /command_filter
    command_filter:
      qos:
        history: keep_last
        depth: 10
        reliability: reliable
        durability: volatile
    operation_mode: adas
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status

    dds:
      domain_id: 1
      lin_vel:
        topic: lin_vel
        qos:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile
      height_map:
        enabled: true
        topic: height_map
        type: core_dds::HeightMap
        publish_rate_hz: 50.0
        thread_priority: 0
        qos:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile

    grid:
      resolution: 0.10
      x_min: -0.60
      x_max: 0.60
      y_min: -0.60
      y_max: 0.60
      min_z: -0.60
      max_z: 0.50

    local_terrain_map:
      enabled: true
      output_image_topic: ~/local_terrain_image
      output_cloud_topic: ~/local_terrain_points
      output_scan_topic: ~/local_terrain_map
      grid:
        resolution: 0.05
        x_min: -0.80
        x_max: 2.00
        y_min: -0.75
        y_max: 0.75
        min_z: -0.60
        max_z: 0.50

    algorithm:
      point_stride: 1
      max_range: 2.5
      print_frame_info: false 
      base_height: 0.33
      clipping_min: 0.0
      clipping_max: 0.33
      fill_debug_outputs: true

      uncertainty:
        noise_alpha: 0.001
        min_meas_var: 0.0004
        init_cell_var: 0.01
        min_cell_var: 0.0004
        max_cell_var: 0.25
        time_var_rate: 0.2
        mahalanobis_thresh: 3.0
        dyn_env_var_bump: 0.0225
        dyn_reset_delta: 0.1

      frame_aggregation:
        robust_height_gate: 0.04
        intra_cell_min_support_gap: 0.025
        intra_cell_min_support_count: 3
        edge_mix_height_diff: 0.035
        edge_prefer_prev_support_count: 2

      isolated_filter:
        radius: 1
        min_support_neighbors: 2
        support_height_diff: 0.025
        outlier_height_diff: 0.05
        every_n_frames: 2

      hole_fill:
        radius: 1
        min_neighbors: 3
        max_height_diff: 0.03

      bilateral:
        radius: 1
        sigma_spatial: 1.1
        sigma_height: 0.025
        max_height_diff: 0.04
        passes: 2
        every_n_frames: 2

      runtime:
        min_runtime_fps: 60

    fov_filter:
      enabled: true
      h_fov_deg: 87.0
      v_fov_deg: 58.0
      min_depth: 0.175
      max_depth: 2.5
      T_base_optical: [
        -0.0000036732, -0.7071106772, 0.7071028851, 0.0751030000,
        -1.0000000000, 0.0000025974, -0.0000025973, 0.0022538400,
        0.0000000000, -0.7071028852, -0.7071106772, 0.0359610000,
        0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000,
      ]

    command_filter:
      obstacle_floor_z: -0.47957
      obstacle_height_threshold: 0.25
      forward_lateral_half_width: 0.25
      right_longitudinal_half_width: 0.25
      forward_distance: 0.8
      lateral_distance: 0.55
      publish_rate_hz: 10.0

autonomy_manager:
  ros__parameters:
    startup_mode: DRIVE
    pose_topic: /aft_mapped_to_init
    robot_report_topic: /robot_report
    map_dir: src/autonomy/resources/map
    speed_limit: 0.0
    enable_ai: false
    segmentation: false
    heartbeat_timeout_sec: 3.0
    publish_rate_hz: 10.0
    managed_nodes:
      idle: []
      drive: [realsense_usb_mapper, livox_monitor_node, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node]
      adas: [realsense_usb_mapper, livox_monitor_node, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, point_lio_monitor_node, localization_pose_adapter_node, global_planner_node, goal_pose_to_nav2_action_node, cmd_vel_to_command_user_node]
      fsd: [realsense_usb_mapper, livox_monitor_node, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, point_lio_monitor_node, localization_pose_adapter_node, global_planner_node, goal_pose_to_nav2_action_node, cmd_vel_to_command_user_node]
      tracking: [realsense_usb_mapper, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, ai_detection_node, tracking_follower_node]
      mapping: [livox_monitor_node, point_lio_monitor_node, point_lio_map_saver_node]

rl_local_planner_node:
  ros__parameters:
    enabled: true
    planner_backend: dwb_lite  # dwb_lite | mppi_lite | rl
    model_path: ""
    current_pose_topic: /localization/current_pose
    target_pose_topic: /planning/target_pose
    height_scan_topic: /elevation_mapping_node/local_terrain_map
    command_filter_topic: /command_filter
    command_user_topic: /command_user
    local_costmap_topic: ~/local_costmap
    footprint_topic: ~/footprint
    costmap_frame_id: 4w4l/base_footprint
    footprint: [0.35, 0.25, 0.35, -0.25, -0.35, -0.25, -0.35, 0.25]
    autonomy_status_topic: /autonomy_manager/status
    publish_rate_hz: 20.0
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.2
    max_linear_x: 0.45
    max_linear_y: 0.30
    max_angular_z: 0.9
    max_linear_accel: 0.6
    max_angular_accel: 1.2
    rollout_dt: 0.1
    rollout_steps: 10
    traversability_obstacle_floor_z: -0.47957
    traversability_obstacle_height: 0.25
    traversability_unknown_cost: 0.45
    traversability_obstacle_cost: 1000.0
    inflation_radius: 0.45
    inflation_cost_scaling_factor: 3.0
    footprint_padding: 0.02
    dwb_samples_x: 7
    dwb_samples_y: 5
    dwb_samples_wz: 7
    weight_goal_distance: 4.0
    weight_goal_heading: 1.0
    weight_terrain: 8.0
    weight_smoothness: 0.4
    weight_speed: 0.2
    mppi_samples: 64
    mppi_noise_x: 0.18
    mppi_noise_y: 0.12
    mppi_noise_wz: 0.35

ai_detection_node:
  ros__parameters:
    enabled: true
    model_path: src/autonomy/resources/weights/yolo11n_640x480x3.onnx
    # Input topics are overridden by launch from camera_bindings in this file.
    image_topic: /robot_4w4l/adas_camera/rgb/image_raw
    camera_info_topic: /robot_4w4l/adas_camera/rgb/camera_info
    depth_topic: /robot_4w4l/adas_camera/depth/image_rect_raw
    annotated_image_topic: ~/annotated_image
    detections_topic: ~/detections
    confidence_threshold: 0.35
    nms_threshold: 0.45
    input_width: 640
    input_height: 480
    depth_sample_radius: 3
    log_inference: true

tracking_follower_node:
  ros__parameters:
    enabled: true
    detections_topic: /ai_detection_node/detections
    autonomy_status_topic: /autonomy_manager/status
    cmd_vel_topic: /cmd_vel
    target_label: ""
    target_distance_m: 1.0
    linear_gain: 0.6
    angular_gain: 1.2
    max_linear_speed: 0.4
    max_angular_speed: 0.8
    target_timeout_sec: 0.5
    publish_rate_hz: 20.0

localization_pose_adapter_node:
  ros__parameters:
    odom_topic: /aft_mapped_to_init
    pose2d_topic: /localization/current_pose
    path_topic: /localization/trajectory
    heartbeat_name: localization_pose_adapter_node
    odom_frame_id: map
    base_frame_id: 4w4l/base_footprint
    publish_tf: false
    odom_timeout_sec: 0.5
    recovery_timeout_sec: 3.0
    recovery_cooldown_sec: 8.0
    path_min_distance: 0.03
    path_max_poses: 2000
    invalid_odom_recovery_threshold: 5
    reset_odom_service: /reset_odom
    publish_rate_hz: 10.0
    dds:
      domain_id: 1
      lin_vel:
        enabled: true
        topic: lin_vel
        type: core_dds::LinearVelocity
        qos:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile

global_planner_node:
  ros__parameters:
    enabled: true
    planner_backend: astar
    current_pose_topic: /localization/current_pose
    goal_topic: /goal_pose
    map_topic: /planning/global_costmap
    map_file: src/autonomy/resources/map/global_costmap.yaml
    path_topic: /planning/global_path
    target_pose_topic: /planning/target_pose
    use_example_map: true
    map_frame_id: map
    example_map_width: 120
    example_map_height: 80
    example_map_resolution: 0.1
    example_map_origin_x: -2.0
    example_map_origin_y: -4.0
    allow_diagonal: true
    path_smoothing: true
    local_target_lookahead: 1.0
    lethal_cost_threshold: 100
    unknown_policy: avoid
    unknown_cost: 80
    cost_weight: 3.0
    publish_rate_hz: 2.0

nav2:
  ros__parameters:
    enabled: true
    package: nav2_bringup
    launch_file: navigation_launch.py
    params_file: resources/config/nav2_point_lio.yaml
    autostart: true
    launch_arguments:
      use_composition: false

goal_pose_to_nav2_action_node:
  ros__parameters:
    enabled: true
    goal_pose_topic: /goal_pose
    navigate_to_pose_action: navigate_to_pose
    behavior_tree: ""
    server_wait_timeout_sec: 0.5
    publish_rate_hz: 2.0
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status
    active_modes: [ADAS, FSD]

cmd_vel_to_command_user_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    command_user_topic: /command_user
    odom_frame_id: odom
    base_frame_id: 4w4l/base_footprint
    publish_rate_hz: 50.0
    cmd_timeout_sec: 0.25
    integrate_commanded_pose: true
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status
    active_modes: [ADAS, FSD]

rviz2:
  ros__parameters:
    enabled: false
    config_path: ""

livox_monitor_node:
  ros__parameters:
    enabled: true
    simulation: false
    pointcloud_topic: /livox/lidar
    required_frame_contains: livox
    detection_timeout_sec: 1.0
    min_points: 1
    publish_rate_hz: 5.0

livox_driver:
  ros__parameters:
    enabled: true
    package: livox_ros_driver2
    executable: livox_ros_driver2_node
    xfer_format: 0
    multi_topic: 0
    data_src: 0
    publish_freq: 10.0
    output_data_type: 0
    frame_id: livox_frame
    lvx_file_path: /tmp/autonomy_mid360.lvx
    cmdline_input_bd_code: livox0000000001
    user_config_path: ""

point_lio_monitor_node:
  ros__parameters:
    enabled: true
    simulation: false
    odometry_topic: /aft_mapped_to_init
    detection_timeout_sec: 1.0
    publish_rate_hz: 5.0

point_lio_map_saver_node:
  ros__parameters:
    enabled: true
    cloud_topic: /cloud_registered
    map_topic: /planning/global_costmap
    map_dir: src/autonomy/resources/map
    map_basename: global_costmap
    frame_id: map
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status
    active_modes: [MAPPING]
    resolution: 0.1
    width: 400
    height: 400
    origin_x: -20.0
    origin_y: -20.0
    z_min: -0.4
    z_max: 2.0
    occupied_count_threshold: 2
    publish_rate_hz: 1.0
    save_period_sec: 10.0

point_lio:
  ros__parameters:
    enabled: true
    package: point_lio
    real_config_file: mid360.yaml
    simulation_config_file: velody16.yaml
    lidar_topic_real: /livox/lidar
    lidar_topic_simulation: /robot_4w4l/livox/lidar
    imu_topic_real: /livox/imu
    imu_topic_simulation: /robot_4w4l/imu
    odom_frame_id: map
    base_frame_id: 4w4l/base_footprint
