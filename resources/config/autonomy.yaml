operation_modes:
  drive:
    camera_roles: [front, rear]
    require_roles: []

  adas:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  fsd:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  tracking:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  mapping:
    camera_roles: []
    require_roles: []

camera_bindings:
  simulation:
    - role: adas
      enabled: true
      model: d435
      camera_name: adas_camera
      rgb_topic: /robot_4w4l/adas_camera/rgb/image_raw
      rgb_camera_info_topic: /robot_4w4l/adas_camera/rgb/camera_info
      left_image_topic: /robot_4w4l/adas_camera/left/image_raw
      right_image_topic: /robot_4w4l/adas_camera/right/image_raw
      left_camera_info_topic: /robot_4w4l/adas_camera/left/camera_info
      right_camera_info_topic: /robot_4w4l/adas_camera/right/camera_info
      imu_topic: /robot_4w4l/imu
      depth_topic: /robot_4w4l/adas_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/adas_camera/depth/camera_info
      mount_frame: A_camera_link
      optical_frame: A_camera_link

    - role: front
      enabled: true
      model: d435
      camera_name: front_camera
      imu_topic: /robot_4w4l/front_camera/imu
      rgb_topic: /robot_4w4l/front_camera/rgb/image_raw
      rgb_camera_info_topic: /robot_4w4l/front_camera/rgb/camera_info
      depth_topic: /robot_4w4l/front_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/front_camera/depth/camera_info
      mount_frame: F_camera_link
      optical_frame: F_camera_link

    - role: rear
      enabled: true
      model: d435
      camera_name: rear_camera
      depth_topic: /robot_4w4l/rear_camera/depth/image_rect_raw
      camera_info_topic: /robot_4w4l/rear_camera/depth/camera_info
      mount_frame: R_camera_link
      optical_frame: R_camera_link

  real:
    - role: adas
      enabled: true
      usb_port_id: ""
      model: d435
      camera_name: adas_camera
      rgb_topic: /adas_camera/color/image_raw
      rgb_camera_info_topic: /adas_camera/color/camera_info
      left_image_topic: /adas_camera/infra1/image_rect_raw
      right_image_topic: /adas_camera/infra2/image_rect_raw
      left_camera_info_topic: /adas_camera/infra1/camera_info
      right_camera_info_topic: /adas_camera/infra2/camera_info
      imu_topic: /adas_camera/imu
      depth_topic: /adas_camera/depth/image_rect_raw
      camera_info_topic: /adas_camera/depth/camera_info
      mount_frame: A_camera_link
      optical_frame: A_camera_link

    - role: front
      enabled: true
      usb_port_id: "2-1.3"
      model: d435
      camera_name: front_camera
      imu_topic: /front_camera/imu
      rgb_topic: /front_camera/color/image_raw
      rgb_camera_info_topic: /front_camera/color/camera_info
      depth_topic: /front_camera/depth/image_rect_raw
      camera_info_topic: /front_camera/depth/camera_info
      mount_frame: F_camera_link
      optical_frame: F_camera_link

    - role: rear
      enabled: true
      usb_port_id: "2-1.1"
      model: d435
      camera_name: rear_camera
      depth_topic: /rear_camera/depth/image_rect_raw
      camera_info_topic: /rear_camera/depth/camera_info
      mount_frame: R_camera_link
      optical_frame: R_camera_link

stream:
  depth_width: 640
  depth_height: 480
  depth_fps: 60
  color_width: 640
  color_height: 480
  color_fps: 30
  max_range: 2.5
  fallback_profiles:
    - {depth_width: 640, depth_height: 480, depth_fps: 30, color_width: 640, color_height: 480, color_fps: 30}
    - {depth_width: 848, depth_height: 480, depth_fps: 60, color_width: 848, color_height: 480, color_fps: 30}
    - {depth_width: 640, depth_height: 360, depth_fps: 60, color_width: 640, color_height: 360, color_fps: 30}
    - {depth_width: 424, depth_height: 240, depth_fps: 60, color_width: 424, color_height: 240, color_fps: 30}

robot_state_publisher:
  ros__parameters:
    enabled: true
    urdf_path: src/autonomy/resources/urdf/f16.urdf
    frame_prefix: 4w4l/

pointcloud_merge_node:
  ros__parameters:
    target_frame: 4w4l/base_link
    frame_prefix: 4w4l/
    publish_rate_hz: 20.0
    max_cloud_age_sec: 0.0
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status

    depth_filter:
      min_range: 0.05
      max_range: 2.5
      pixel_stride: 2

imu_stabilized_tf_node:
  ros__parameters:
    imu_topic: /robot_4w4l/front_camera/imu
    base_frame_id: 4w4l/base_link
    stabilized_frame_id: 4w4l/base_stabilized
    publish_rate_hz: 100.0
    low_pass_alpha: 0.08
    min_accel_norm: 3.0
    max_accel_norm: 20.0
    roll_sign: -1.0
    pitch_sign: -1.0

elevation_mapping_node:
  ros__parameters:
    input_cloud_topic: /pointcloud_merge_node/merged_points
    output_image_topic: ~/elevation_image
    output_cloud_topic: ~/elevation_points
    output_masked_height_scan_topic: ~/masked_height_scan
    command_filter_topic: /command_filter
    operation_mode: adas
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status

    dds:
      height_map:
        enabled: true
        domain_id: 0
        topic: height_map
        type: core_dds::HeightMap

    grid:
      resolution: 0.05
      x_min: -0.80
      x_max: 0.80
      y_min: -0.55
      y_max: 0.55
      min_z: -0.60
      max_z: 0.50

    local_terrain_map:
      enabled: true
      output_image_topic: ~/local_terrain_image
      output_cloud_topic: ~/local_terrain_points
      output_scan_topic: ~/local_terrain_map
      grid:
        resolution: 0.05
        x_min: -0.80
        x_max: 2.00
        y_min: -0.75
        y_max: 0.75
        min_z: -0.60
        max_z: 0.50

    algorithm:
      point_stride: 1
      max_range: 2.5
      print_frame_info: false
      height_scan_offset: 0.5
      base_height: 0.5
      fill_debug_outputs: true
      debug_fill_z: -0.47957

      uncertainty:
        noise_alpha: 0.001
        min_meas_var: 0.0004
        init_cell_var: 0.01
        min_cell_var: 0.0004
        max_cell_var: 0.25
        time_var_rate: 0.2
        mahalanobis_thresh: 3.0
        dyn_env_var_bump: 0.0225
        dyn_reset_delta: 0.1

      frame_aggregation:
        robust_height_gate: 0.04
        intra_cell_min_support_gap: 0.025
        intra_cell_min_support_count: 3
        edge_mix_height_diff: 0.035
        edge_prefer_prev_support_count: 2

      isolated_filter:
        radius: 1
        min_support_neighbors: 2
        support_height_diff: 0.025
        outlier_height_diff: 0.05
        every_n_frames: 2

      hole_fill:
        radius: 1
        min_neighbors: 3
        max_height_diff: 0.03

      bilateral:
        radius: 1
        sigma_spatial: 1.1
        sigma_height: 0.025
        max_height_diff: 0.04
        passes: 2
        every_n_frames: 2

      runtime:
        min_runtime_fps: 60

    command_filter:
      obstacle_floor_z: -0.47957
      obstacle_height_threshold: 0.25
      forward_lateral_half_width: 0.25
      right_longitudinal_half_width: 0.25
      forward_distance: 0.8
      lateral_distance: 0.55
      publish_rate_hz: 10.0

autonomy_manager:
  ros__parameters:
    startup_mode: IDLE
    pose_topic: /rtabmap/odom
    robot_report_topic: /robot_report
    map_dir: src/autonomy/resources/map
    speed_limit: 0.0
    enable_ai: false
    segmentation: false
    heartbeat_timeout_sec: 1.0
    publish_rate_hz: 10.0
    managed_nodes:
      idle: []
      drive: [realsense_usb_mapper, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node]
      adas: [realsense_usb_mapper, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, rtabmap_localization_node, rl_local_planner_node]
      fsd: [realsense_usb_mapper, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, rtabmap_localization_node, livox_monitor_node, point_lio_monitor_node, rl_local_planner_node, global_planner_node]
      tracking: [realsense_usb_mapper, imu_stabilized_tf_node, pointcloud_merge_node, elevation_mapping_node, ai_detection_node, tracking_follower_node]
      mapping: [livox_monitor_node, point_lio_monitor_node, point_lio_map_saver_node]

rl_local_planner_node:
  ros__parameters:
    enabled: true
    planner_backend: dwb_lite  # dwb_lite | mppi_lite | rl
    model_path: ""
    current_pose_topic: /localization/current_pose
    target_pose_topic: /planning/target_pose
    height_scan_topic: /elevation_mapping_node/local_terrain_map
    command_filter_topic: /command_filter
    command_user_topic: /command_user
    local_costmap_topic: ~/local_costmap
    footprint_topic: ~/footprint
    costmap_frame_id: 4w4l/base_footprint
    footprint: [0.35, 0.25, 0.35, -0.25, -0.35, -0.25, -0.35, 0.25]
    autonomy_status_topic: /autonomy_manager/status
    publish_rate_hz: 20.0
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.2
    max_linear_x: 0.45
    max_linear_y: 0.30
    max_angular_z: 0.9
    max_linear_accel: 0.6
    max_angular_accel: 1.2
    rollout_dt: 0.1
    rollout_steps: 10
    traversability_obstacle_floor_z: -0.47957
    traversability_obstacle_height: 0.25
    traversability_unknown_cost: 0.45
    traversability_obstacle_cost: 1000.0
    inflation_radius: 0.45
    inflation_cost_scaling_factor: 3.0
    footprint_padding: 0.02
    dwb_samples_x: 7
    dwb_samples_y: 5
    dwb_samples_wz: 7
    weight_goal_distance: 4.0
    weight_goal_heading: 1.0
    weight_terrain: 8.0
    weight_smoothness: 0.4
    weight_speed: 0.2
    mppi_samples: 64
    mppi_noise_x: 0.18
    mppi_noise_y: 0.12
    mppi_noise_wz: 0.35

ai_detection_node:
  ros__parameters:
    enabled: true
    model_path: src/autonomy/resources/weights/yolo11n_640x480x3.onnx
    # Input topics are overridden by launch from camera_bindings in this file.
    image_topic: /robot_4w4l/adas_camera/rgb/image_raw
    camera_info_topic: /robot_4w4l/adas_camera/rgb/camera_info
    depth_topic: /robot_4w4l/adas_camera/depth/image_rect_raw
    annotated_image_topic: ~/annotated_image
    detections_topic: ~/detections
    confidence_threshold: 0.35
    nms_threshold: 0.45
    input_width: 640
    input_height: 480
    depth_sample_radius: 3
    log_inference: true

tracking_follower_node:
  ros__parameters:
    enabled: true
    detections_topic: /ai_detection_node/detections
    autonomy_status_topic: /autonomy_manager/status
    cmd_vel_topic: /cmd_vel
    target_label: ""
    target_distance_m: 1.0
    linear_gain: 0.6
    angular_gain: 1.2
    max_linear_speed: 0.4
    max_angular_speed: 0.8
    target_timeout_sec: 0.5
    publish_rate_hz: 20.0

rtabmap_localization_node:
  ros__parameters:
    enabled: true
    simulation_camera_role: adas
    real_camera_role: adas
    simulation_rgb_topic: /robot_4w4l/adas_camera/rgb/image_raw
    simulation_depth_topic: /robot_4w4l/adas_camera/depth/image_rect_raw
    simulation_camera_info_topic: /robot_4w4l/adas_camera/rgb/camera_info
    real_rgb_topic: /adas_camera/color/image_raw
    real_depth_topic: /adas_camera/depth/image_rect_raw
    real_camera_info_topic: /adas_camera/color/camera_info
    odom_topic: /rtabmap/odom
    odom_frame_id: odom
    frame_id: 4w4l/base_footprint
    approx_sync: true
    approx_sync_max_interval: 0.05
    queue_size: 10
    publish_tf: false
    publish_null_when_lost: false
    wait_for_transform: 0.2
    subscribe_depth: true
    "Reg/Force3DoF": "true"
    "Odom/GuessMotion": "true"
    "Odom/KeyFrameThr": "0.15"
    "Odom/VisKeyFrameThr": "30"
    "OdomF2M/MaxSize": "4000"
    "OdomF2M/MaxNewFeatures": "500"
    "OdomF2M/ValidDepthRatio": "0.02"
    "Vis/MinInliers": "8"
    "Vis/MaxFeatures": "2000"
    "GFTT/QualityLevel": "0.0005"
    "GFTT/MinDistance": "3"

localization_pose_adapter_node:
  ros__parameters:
    odom_topic: /rtabmap/odom
    pose2d_topic: /localization/current_pose
    path_topic: /localization/trajectory
    heartbeat_name: rtabmap_localization_node
    odom_frame_id: odom
    base_frame_id: 4w4l/base_footprint
    odom_timeout_sec: 0.5
    recovery_timeout_sec: 3.0
    recovery_cooldown_sec: 8.0
    path_min_distance: 0.03
    path_max_poses: 2000
    invalid_odom_recovery_threshold: 5
    reset_odom_service: /reset_odom
    publish_rate_hz: 10.0

global_planner_node:
  ros__parameters:
    enabled: true
    planner_backend: astar
    current_pose_topic: /localization/current_pose
    goal_topic: /goal_pose
    map_topic: /planning/global_costmap
    map_file: src/autonomy/resources/map/global_costmap.yaml
    path_topic: /planning/global_path
    target_pose_topic: /planning/target_pose
    use_example_map: true
    map_frame_id: map
    example_map_width: 120
    example_map_height: 80
    example_map_resolution: 0.1
    example_map_origin_x: -2.0
    example_map_origin_y: -4.0
    allow_diagonal: true
    path_smoothing: true
    local_target_lookahead: 1.0
    lethal_cost_threshold: 100
    unknown_policy: avoid
    unknown_cost: 80
    cost_weight: 3.0
    publish_rate_hz: 2.0

livox_monitor_node:
  ros__parameters:
    enabled: true
    simulation: false
    pointcloud_topic: /livox/lidar
    required_frame_contains: ""
    detection_timeout_sec: 1.0
    min_points: 1
    publish_rate_hz: 5.0

livox_driver:
  ros__parameters:
    enabled: true
    package: livox_ros_driver2
    launch_file: rviz_MID360_launch.py
    launch_arguments: {}

point_lio_monitor_node:
  ros__parameters:
    enabled: true
    simulation: false
    odometry_topic: /aft_mapped_to_init
    detection_timeout_sec: 1.0
    publish_rate_hz: 5.0

point_lio_map_saver_node:
  ros__parameters:
    enabled: true
    cloud_topic: /cloud_registered
    map_topic: /planning/global_costmap
    map_dir: src/autonomy/resources/map
    map_basename: global_costmap
    frame_id: map
    respect_autonomy_mode: true
    autonomy_status_topic: /autonomy_manager/status
    active_modes: [MAPPING]
    resolution: 0.1
    width: 400
    height: 400
    origin_x: -20.0
    origin_y: -20.0
    z_min: -0.4
    z_max: 2.0
    occupied_count_threshold: 2
    publish_rate_hz: 1.0
    save_period_sec: 10.0

point_lio:
  ros__parameters:
    enabled: true
    package: point_lio
    real_launch_file: mapping_avia.launch.py
    simulation_launch_file: mapping_velody16.launch.py
    lidar_topic_real: /livox/lidar
    lidar_topic_simulation: /robot_4w4l/livox/lidar
    launch_arguments:
      lid_topic: /livox/lidar
