robot:
  model: f16

operation_modes:
  drive:
    camera_roles: [front, rear]
    require_roles: []

  auto:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  tracking:
    camera_roles: [front, rear, adas]
    require_roles: [adas]

  mapping:
    camera_roles: []
    require_roles: []

camera_bindings:
  - role: adas
    enabled: false
    usb_port_id: ""
    model: d435
    camera_name: adas_camera
    frame: A_camera_link

  - role: front
    enabled: true
    usb_port_id: "2-1.4"
    model: d435i
    camera_name: front_camera
    frame: F_camera_link

  - role: rear
    enabled: false
    usb_port_id: "2-1.1"
    model: d435
    camera_name: rear_camera
    frame: R_camera_link

stream:
  depth_width: 640
  depth_height: 480
  depth_fps: 60
  color_width: 640
  color_height: 480
  color_fps: 30
  max_range: 2.5
  fallback_profiles:
    - {depth_width: 640, depth_height: 480, depth_fps: 30, color_width: 640, color_height: 480, color_fps: 30}
    - {depth_width: 848, depth_height: 480, depth_fps: 60, color_width: 848, color_height: 480, color_fps: 30}
    - {depth_width: 640, depth_height: 360, depth_fps: 60, color_width: 640, color_height: 360, color_fps: 30}
    - {depth_width: 424, depth_height: 240, depth_fps: 60, color_width: 424, color_height: 240, color_fps: 30}

camera_temperature:
  enabled: true
  publish_rate_hz: 1.0
  danger_celsius: 70.0
  shutdown_on_danger: true

dds_network:
  mode: wireless  # wired or wireless
  interface: enP8p1s0 # optional, e.g. eth0 or enp3s0. Empty selects a connected wired interface.
  local_ip: 192.168.20.10/24
  peer_ip: 192.168.20.1
  allow_multicast: true

drive_mapper_node:
  ros__parameters:
    publish_static_tf: true
    publish_attitude_correction: true
    attitude_correction_topic: ~/attitude_correction
    low_pass_alpha: 0.08
    min_accel_norm: 3.0
    max_accel_norm: 20.0
    roll_sign: -1.0
    pitch_sign: -1.0

pointcloud_merge_node:
  ros__parameters:
    target_frame: base_link
    publish_rate_hz: 50.0
    max_cloud_age_sec: 0.0
    respect_autonomy_mode: false
    autonomy_status_topic: /autonomy_manager/status
    attitude_correction.enabled: true
    attitude_correction.topic: /drive_mapper_node/attitude_correction

    depth_filter:
      min_range: 0.05
      max_range: 2.5
      pixel_stride: 2

    lidar_names: [livox]
    lidars:
      livox:
        enabled: true

point_lio_lidar_adapter_node:
  ros__parameters:
    output_topic: /point_lio/lidar
    ring: 0
    synthetic_scan_period: 0.1
    estimate_scan_period: true
    min_scan_period: 0.02
    max_scan_period: 0.25
    period_filter_alpha: 0.2

point_lio:
  ros__parameters:
    use_imu_as_input: false
    prop_at_freq_of_imu: true
    check_satu: true
    init_map_size: 10
    space_down_sample: true
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    preprocess.lidar_type: 5
    preprocess.scan_line: 40
    preprocess.scan_rate: 10
    preprocess.timestamp_unit: 0
    preprocess.blind: 0.1
    point_filter_num: 4
    mapping.imu_en: true
    mapping.imu_time_inte: 0.005
    mapping.acc_norm: 1.0
    mapping.extrinsic_est_en: false
    mapping.satu_acc: 3.0
    mapping.satu_gyro: 35.0
    mapping.imu_meas_acc_cov: 0.1
    mapping.imu_meas_omg_cov: 0.1
    mapping.gyr_cov_input: 0.01
    mapping.acc_cov_input: 0.1
    mapping.lidar_meas_cov: 0.05
    publish.scan_bodyframe_pub_en: false
    runtime_pos_log_enable: false

point_lio_monitor_node:
  ros__parameters:
    odom_topic: /aft_mapped_to_init
    cloud_topic: /cloud_registered
    timeout_sec: 3.0
    max_abs_z: 2.0
    max_abs_position: 30.0
    max_linear_speed: 3.0
    max_angular_speed: 3.0

global_costmap_node:
  ros__parameters:
    cloud_topic: /cloud_registered
    costmap_topic: ~/global_costmap
    resolution: 0.10
    x_min: -20.0
    x_max: 20.0
    y_min: -20.0
    y_max: 20.0
    min_obstacle_z: 0.05
    max_obstacle_z: 1.50
    hit_increment: 8
    decay_per_publish: 0
    publish_rate_hz: 2.0

local_costmap_node:
  ros__parameters:
    height_scan_topic: /elevation_mapping_node/local_terrain_map
    costmap_topic: ~/local_costmap
    lethal_height: 0.18
    inscribed_height: 0.08

global_planner_node:
  ros__parameters:
    local_goal_topic: /global_planner_node/local_goal
    path_topic: /global_planner_node/path
    lookahead_distance: 1.2
    lateral_offset: 0.0
    publish_rate_hz: 10.0

local_planner_node:
  ros__parameters:
    enabled: false
    height_scan_topic: /elevation_mapping_node/local_terrain_map
    command_filter_topic: /command_filter
    goal_topic: /global_planner_node/local_goal
    cmd_vel_topic: /local_planner_node/cmd_vel
    command_user_topic: /control_command/autopilot
    command_child_frame_id: base_link
    publish_rate_hz: 20.0
    max_vx: 0.30
    max_vy: 0.15
    max_wz: 0.45
    min_forward_vx: 0.04
    robot_radius: 0.32
    rollout_time: 1.0
    rollout_dt: 0.15
    obstacle_height_threshold: 0.18
    step_height_threshold: 0.10
    unknown_is_blocked: false
    stale_timeout_sec: 1.0
    dds:
      enabled: true
      domain_id: 1
      lin_vel:
        topic: lin_vel
        type: core_dds::LinearVelocity

elevation_mapping_node:
  ros__parameters:
    input_cloud_topic: /pointcloud_merge_node/merged_points
    output_image_topic: ~/elevation_image
    output_cloud_topic: ~/elevation_points
    output_masked_height_scan_topic: ~/masked_height_scan
    output_publish_rate_hz: 50.0
    command_filter_topic: /command_filter
    command_filter:
      qos:
        history: keep_last
        depth: 10
        reliability: reliable
        durability: volatile
    operation_mode: drive
    respect_autonomy_mode: false
    autonomy_status_topic: /autonomy_manager/status

    dds:
      domain_id: 1
      lin_vel:
        topic: lin_vel
        qos:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile
      height_map:
        enabled: true
        topic: height_map
        type: core_dds::HeightMap
        publish_rate_hz: 50.0
        thread_priority: 0
        qos:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile

    grid:
      resolution: 0.10
      x_min: -0.60
      x_max: 0.60
      y_min: -0.60
      y_max: 0.60
      min_z: -0.60
      max_z: 0.50

    local_terrain_map:
      enabled: true
      output_image_topic: ~/local_terrain_image
      output_cloud_topic: ~/local_terrain_points
      output_scan_topic: ~/local_terrain_map
      grid:
        resolution: 0.05
        x_min: -0.80
        x_max: 2.00
        y_min: -0.75
        y_max: 0.75
        min_z: -0.60
        max_z: 0.50

    algorithm:
      point_stride: 1
      max_range: 2.5
      print_frame_info: false 
      base_height: 0.47957
      clipping_min: 0.0
      clipping_max: 0.47957
      fill_debug_outputs: true

      uncertainty:
        noise_alpha: 0.001
        min_meas_var: 0.0004
        init_cell_var: 0.01
        min_cell_var: 0.0004
        max_cell_var: 0.25
        time_var_rate: 0.2
        mahalanobis_thresh: 3.0
        dyn_env_var_bump: 0.0225
        dyn_reset_delta: 0.1

      frame_aggregation:
        robust_height_gate: 0.04
        intra_cell_min_support_gap: 0.025
        intra_cell_min_support_count: 3
        edge_mix_height_diff: 0.035
        edge_prefer_prev_support_count: 2

      isolated_filter:
        radius: 1
        min_support_neighbors: 2
        support_height_diff: 0.025
        outlier_height_diff: 0.05
        every_n_frames: 2

      hole_fill:
        radius: 1
        min_neighbors: 3
        max_height_diff: 0.03

      bilateral:
        radius: 1
        sigma_spatial: 1.1
        sigma_height: 0.025
        max_height_diff: 0.04
        passes: 2
        every_n_frames: 2

      runtime:
        min_runtime_fps: 60

    costmap:
      inscribed_height: 0.08
      lethal_height: 0.18

    fov_filter:
      enabled: true
      h_fov_deg: 87.0
      v_fov_deg: 58.0
      min_depth: 0.175
      max_depth: 2.5
      T_base_optical: [
        -0.0000036732, -0.7071106772, 0.7071028851, 0.0751030000,
        -1.0000000000, 0.0000025974, -0.0000025973, 0.0022538400,
        0.0000000000, -0.7071028852, -0.7071106772, 0.0359610000,
        0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000,
      ]

    command_filter:
      obstacle_floor_z: -0.47957
      obstacle_height_threshold: 0.25
      forward_lateral_half_width: 0.25
      right_longitudinal_half_width: 0.25
      forward_distance: 0.8
      lateral_distance: 0.55
      publish_rate_hz: 10.0

autonomy_manager:
  ros__parameters:
    startup_mode: DRIVE
    pose_topic: /aft_mapped_to_init
    robot_report_topic: /robot_report
    map_dir: src/autonomy/resources/map
    speed_limit: 0.0
    enable_ai: false
    segmentation: false
    heartbeat_timeout_sec: 3.0
    publish_rate_hz: 10.0
    managed_nodes:
      drive: [drive_mapper_node, pointcloud_merge_node, elevation_mapping_node]
      auto: [drive_mapper_node, pointcloud_merge_node, elevation_mapping_node, point_lio_lidar_adapter_node, point_lio_monitor_node, global_costmap_node, global_planner_node, local_planner_node]

rviz2:
  ros__parameters:
    enabled: false
    config_path: ""
