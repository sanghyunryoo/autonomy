# SensorManager owns direct SDK drivers, inventory, URDF transforms, and raw data.
# No ROS sensor topic is used here.
sensor:
  base_frame: base_link
  target_frame: base_link
  urdf_path: ../urdf/f16.urdf

  cameras:
    # Supported models: d435, d435i, d435if. The serial is preferred when it
    # is known; otherwise port is matched against librealsense physical_port.
    - id: front_d435i
      model: d435i
      port: "2-1.3"
      serial: ""
      role: front
      frame: F_camera_link
      width: 640
      height: 480
      fps: 30
      enable_imu: true
      timeout_ms: 500
      enabled: true

    - id: rear_realsense
      model: d435
      port: "SET_USB3_PORT"
      serial: ""
      role: rear
      frame: R_camera_link
      width: 640
      height: 480
      fps: 30
      enable_imu: false
      enabled: false

    - id: ai_realsense
      model: d435if
      port: "SET_USB3_PORT"
      serial: ""
      role: ai_detection
      frame: A_camera_link
      width: 640
      height: 480
      fps: 30
      enable_imu: true
      enabled: false

  lidars:
    - id: mid360
      model: mid360
      ip: 192.168.1.166
      role: primary
      frame: lidar_link
      # Livox SDK2 JSON; it contains the matching model, LiDAR IP, and the
      # Jetson host IP/ports. Use livox/mid360s.json for MID-360S.
      sdk_config_path: livox/mid360.json
      timeout_ms: 500
      enabled: true
