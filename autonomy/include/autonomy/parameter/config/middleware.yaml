# MiddlewareManager is the sole ROS 2/Cyclone DDS boundary.
middleware:
  ros2:
    robot_report_topic: /robot_report
    # Autonomy control command. This is distinct from the DDS SLAM velocity estimate.
    command_topic: /control_command/autopilot
    autopilot_hz: 10.0
    # Reference core consumes this directional terrain/obstacle filter.
    command_filter_topic: /command_filter
    # The only navigation input is the requested map-frame goal. SLAM and map
    # are produced internally by AlgorithmManager.
    navigation_goal_topic: /autonomy/navigation_goal

    # Debug publishers are disabled by default. All high-volume streams are
    # bounded and sent only at this low rate.
    debug:
      enabled: false
      hz: 2.0
      max_points_per_cloud: 2000
      max_path_poses: 200
      max_image_width: 320
      max_image_height: 240
      elevation_points_topic: /autonomy/debug/elevation_points
      sensor_tf_topic: /autonomy/debug/sensor_tf
      slam_odom_topic: /autonomy/debug/slam/odom
      slam_path_topic: /autonomy/debug/slam/path
      livox_points_topic: /autonomy/debug/livox_points
      # ai_realsense RGB and its bbox overlay are also sent at debug.hz.
      ai_rgb_topic: /autonomy/debug/ai_realsense/rgb
      ai_bbox_topic: /autonomy/debug/ai_realsense/bbox

  dds:
    enabled: true
    domain_id: 0
    height_map_topic: autonomy/height_map
    # Super-LIO ESKF map-frame linear velocity: [vx, vy, vz] (m/s).
    linear_velocity_topic: autonomy/linear_velocity
